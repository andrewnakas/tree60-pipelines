name: wind

# Replaces scheduled_wind_tiles, scheduled_wind_archive and
# scheduled_wind_velocity_archive (~$5.20/mo between them on 2 GiB Cloud Run).
# Same GFS Zarr read as the temperature job.
on:
  schedule:
    # Tiles: ~3.5 h after each GFS run, matching the old schedule.
    - cron: '35 3,9,15,21 * * *'
    # Velocity forecast fields, same cadence, offset so the two do not overlap.
    - cron: '50 3,9,15,21 * * *'
    # Hourly archives. Split by minute so the two never contend for the runner.
    - cron: '10 * * * *'
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        type: choice
        options: [archive, velocity, tiles, velocity-forecast]
        default: archive

concurrency:
  group: wind-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick task
        id: pick
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*) task="${{ inputs.task }}" ;;
            *"35 3,9,15,21 * * *") task=tiles ;;
            *"50 3,9,15,21 * * *") task=velocity-forecast ;;
            *"15 * * * *")         task=velocity ;;
            *)                     task=archive ;;
          esac
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "running: $task"

      - name: Run
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python jobs/wind.py ${{ steps.pick.outputs.task }}
# Schedule re-registered 2026-11-18 after GitHub disabled it for inactivity.
