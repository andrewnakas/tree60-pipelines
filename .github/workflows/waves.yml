name: waves

# Replaces scheduled_wave_render (~$1.95/mo on 8 GiB Cloud Run). GFS-Wave publishes
# 6-hourly; the old job ran at :15 past 0/6/12/18 UTC plus processing lag.
on:
  schedule:
    - cron: '15 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      max_hours:
        description: Forecast hours to render (blank = module default)
        type: string
        default: ''

concurrency:
  group: waves
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt -r requirements-waves.txt

      - name: Render
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python jobs/waves.py ${{ inputs.max_hours && format('--max-hours {0}', inputs.max_hours) || '' }}
# Schedule re-registered 2026-11-18 after GitHub disabled it for inactivity.
